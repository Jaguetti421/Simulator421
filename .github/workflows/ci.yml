# The Last Clan — web build CI (TP v2.0 §21; W0-01).
#
# Jobs
#   verify  — build, lint, vitest, kit planning tools, fixture subset, workboard check.
#   screens — Playwright 3D screenshots via /capture. BLOCKED_RENDER until W0-10 ships
#             the web shell and /capture route; the job exists so the gate evidence can
#             point at it, and it is skipped (never green) until then.
#
# Nothing here has run on a GitHub runner yet: no repository was provided at W0-01
# (see state/STATUS.md "Continuity"). The workflow was validated locally with the
# same commands; CI execution itself is BLOCKED_TOOL until a repository exists.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "build · lint · test · fixtures · workboard"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python (kit planning tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record environment
        run: |
          echo "node $(node --version) · npm $(npm --version) · python $(python3 --version)" | tee environment.txt
          uname -a >> environment.txt

      - name: Install (npm ci, lockfile is authoritative)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint (ESLint boundaries included)
        run: npm run lint

      - name: "Test (vitest: architecture boundaries, clanlab stub)"
        run: npm test

      - name: Kit planning tools (python unittest)
        run: npm run test:tools

      # The fixture subset runs the three example fixtures through clanlab. Until W0-05/W0-06
      # ship the validator and runner, clanlab reports NOT_IMPLEMENTED with exit 3 (never PASS).
      # continue-on-error keeps the step visible as a warning instead of hiding it; remove it at W0-06.
      - name: "Fixture subset (clanlab validate) — implemented at W0-05; running fixtures arrives with W0-06"
        run: npm run fixtures

      - name: Workboard check (tools/check_workboard.py)
        run: npm run check:workboard

      - name: Upload environment record
        uses: actions/upload-artifact@v4
        with:
          name: environment
          path: environment.txt
          if-no-files-found: error

  screens:
    name: "Playwright browser suite: shell, worker hash parity, persistence, /capture"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build packages and the static site
        run: npm run build
      # The runner has no browsers preinstalled, unlike the development sandbox.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright suite
        run: npm run test:e2e
      # Captures are produced by tests/playwright/capture.spec.ts and carry their
      # own PNG metadata (fixture, tick, camera, kernel digest, FakeSim watermark).
      # Software rendering proves layout and correctness only: frame budgets and
      # GPU quality remain HUMAN_REQUIRED on Jani's PC.
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: handoffs/W0-10/evidence/*.png
          if-no-files-found: warn
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
